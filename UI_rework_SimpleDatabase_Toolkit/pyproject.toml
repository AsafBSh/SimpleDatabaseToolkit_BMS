[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-database-toolkit"
dynamic = ["version"]
description = "Modern Windows edition of Falcon BMS Simple Database Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8.1,<7",
    "matplotlib>=3.10,<4",
    "Pillow>=11,<12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]
build = [
    "pyinstaller>=6.11,<7",
]

[project.scripts]
simple-database-toolkit = "simple_database_toolkit.application:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "simple_database_toolkit.version.__version__"}

[tool.setuptools.package-data]
simple_database_toolkit = ["ui/styles/*.qss"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["simple_database_toolkit"]
branch = true
